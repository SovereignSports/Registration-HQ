<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b46"><title>Registration HQ · R1.4 Cards</title><style>
:root{--navy:#142b46;--gold:#b58d49;--ink:#172b43;--muted:#607083;--line:#dce3eb;--bg:#f3f5f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.header{padding:22px 20px;background:var(--navy);color:white;text-align:center}.eyebrow{font-size:11px;letter-spacing:.15em;color:#ead3a4;font-weight:800}.header h1{font-size:22px;margin:5px 0}.wrap{max-width:670px;padding:24px 16px 50px;margin:auto}.demo{font-size:12px;color:#68501e;background:#fff6e2;border:1px solid #ebd5aa;padding:10px 14px;border-radius:9px;margin-bottom:23px}.progress{display:flex;align-items:center;gap:13px;margin-bottom:15px}.track{height:5px;border-radius:30px;background:#dce2e9;flex:1;overflow:hidden}.fill{background:var(--gold);height:100%;transition:width .2s}.count{font-weight:700;color:var(--muted);font-size:12px}.card{background:white;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 28px #142b4610;padding:clamp(22px,5vw,39px);min-height:370px}.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:#93723e;font-weight:800}.card h2{font-size:clamp(23px,4vw,29px);line-height:1.17;margin:12px 0 12px}.muted{color:var(--muted)}.card p{margin:0 0 19px}.field{display:flex;flex-direction:column;gap:7px;margin:18px 0;font-weight:650;font-size:14px}.field input,.field select{border:1px solid #b6c4d3;border-radius:10px;padding:14px 12px;background:white;color:var(--ink);width:100%;min-height:50px}.field input:focus,.field select:focus{outline:2px solid #ab874e;outline-offset:1px}.details{font-size:13px;color:var(--muted)}.person{padding:16px;border:1px solid var(--line);border-radius:13px;margin:16px 0}.person .field{margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{border:0;background:var(--navy);color:white;border-radius:10px;padding:13px 19px;font-weight:750}.btn.secondary{background:#eaf0f6;color:var(--navy)}.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}.btn.small{font-size:12px;padding:7px 9px}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:29px}.actions .btn.primary{margin-left:auto}.error{min-height:19px;color:#ae3131;font-size:13px;font-weight:650}.note{border-left:3px solid var(--gold);padding:12px 14px;background:#faf7ef;margin:14px 0;color:#594d3a;font-size:13px}.summaryrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.tiny{font-size:12px}.chip{font-size:12px;background:#edf2f6;padding:5px 10px;border-radius:20px;font-weight:700}.check{display:flex;gap:10px;margin-top:20px;font-size:14px}.check input{width:19px;height:19px;flex-shrink:0}.finish{padding:14px;border:1px solid var(--line);border-radius:12px;margin:10px 0}.footer{font-size:12px;text-align:center;color:var(--muted);margin-top:21px}.hide{display:none!important}@media(max-width:530px){.wrap{padding:18px 12px 35px}.card{padding:23px 20px;min-height:340px}.header{padding:17px}.actions{gap:8px}.btn{padding:12px 13px}}
.choicegrid{display:grid;gap:10px;margin:18px 0}.choice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);padding:15px;border-radius:12px;cursor:pointer;background:#fff}.choice:has(input:checked){border-color:var(--gold);background:#fffaf0;box-shadow:inset 0 0 0 1px var(--gold)}.choice input{margin-top:4px;accent-color:var(--navy)}.choice strong{display:block}.choice small{display:block;color:var(--muted);margin-top:3px}.waivertext{max-height:220px;overflow:auto;background:#f7f9fb;border:1px solid var(--line);padding:18px;border-radius:12px;font-size:14px;line-height:1.65}.signbox{margin:18px 0;padding:16px;border:1px solid #d1dce7;border-radius:12px;background:#f8fafc}.signbox input{background:white}.tag{font-size:12px;border-radius:6px;padding:4px 8px;background:#eaf0f6;color:#334a63}.smallprint{font-size:12px;line-height:1.5;color:var(--muted)}.sectionline{padding:12px 0;border-bottom:1px solid var(--line)}.sectionline strong{display:block}.sectionline span{display:block;color:var(--muted);font-size:13px}.state{padding:11px 13px;border-radius:10px;background:#e8f4ec;color:#235b38;font-size:14px}input[type=checkbox]{accent-color:var(--navy)}@media(max-width:530px){.waivertext{max-height:190px}}</style></head><body><header class="header"><div class="eyebrow">SOVEREIGN SPORTS · REGISTRATION HQ</div><h1>Registration</h1></header><main class="wrap"><div class="demo"><strong>R1.4 design prototype.</strong> Fictional offerings and illustrative waiver wording. Local-only; no submissions, stored signatures, payments, or cloud writes. Use fictional data.</div><div class="progress"><span class="count" id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><section class="card" id="card" aria-live="polite"></section><div class="footer">One card at a time · No payment integration · Development candidate</div></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const offerings=[
 {id:'l-danville',kind:'League HQ · Seasons',name:'Danville · Spring Season (example)',when:'Spring 2027 · Demo',cost:45,extra:false},
 {id:'l-somerset',kind:'League HQ · Seasons',name:'Somerset · Season 1 (example)',when:'2027 · Demo',cost:45,extra:false},
 {id:'t-ice',kind:'Tournament HQ · Events',name:'The Ice Ball (example)',when:'January 23, 2027 · Demo',cost:30,extra:true},
 {id:'t-spring',kind:'Tournament HQ · Events',name:'The Spring Court (example)',when:'April 2027 · Demo',cost:30,extra:true}
];
const person=()=>({id:1,name:'',email:''});
function fresh(){return {step:0,payer:'',payerPhone:'',people:[person()],next:2,offering:'',ack:false,participantName:'',participantEmail:'',participantPhone:'',emergencyName:'',emergencyRelationship:'',emergencyPhone:'',dob:'',path:'',guardianName:'',guardianEmail:'',guardianPhone:'',guardianRelationship:'',guardianConsent:false,universalRead:false,universalSign:'',eventRead:false,eventSign:'',adultConfirmed:false};}
let S=fresh();
const selected=()=>offerings.find(x=>x.id===S.offering);
const isMinor=()=>S.path==='minor';
function steps(){let a=['payer','people','offering','review','identity','phone','emergency']; if(S.path==='minor')a.push('guardian'); a.push('universal'); if(selected()?.extra)a.push('event'); a.push('complete'); return a;}
const names={payer:'Contact',people:'Participants',offering:'Offering',review:'Review',identity:'Age & identity',phone:'Phone',emergency:'Emergency contact',guardian:'Guardian',universal:'General waiver',event:'Event waiver',complete:'Completion'};
function current(){return steps()[Math.min(S.step,steps().length-1)]}
function nav(next='Continue'){return `<div class="error" id="err" role="alert" aria-live="polite"></div><div class="actions">${S.step?'<button class="btn ghost" id="back">← Back</button>':''}<button class="btn primary" id="next">${next} →</button></div>`;}
function lbl(field,id,value,type='text',placeholder=''){return `<label class="field">${field}<input id="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}"></label>`}
function selectOptions(options,chosen){return options.map(x=>`<option value="${esc(x)}" ${chosen===x?'selected':''}>${esc(x)}</option>`).join('')}
function waiverCard(key,title){const ev=key==='event';const read=ev?S.eventRead:S.universalRead;const sign=ev?S.eventSign:S.universalSign;const signer=isMinor()?S.guardianName:S.participantName;return `<div class="kicker">${ev?'Additional event agreement':'General participation agreement'}</div><h2>${esc(title)}</h2><p class="muted">Review the sample terms and acknowledge this agreement separately. The live document will use a fixed, versioned waiver selected by Registration HQ.</p><div class="waivertext" tabindex="0" role="region" aria-label="Illustrative waiver text"><strong>${esc(title)}</strong><p>This is a nonbinding demonstration placeholder. A production waiver would display the complete approved agreement, including applicable risk disclosures, participant responsibilities, releases, and any event-specific rules.</p><p>For this prototype, no legal terms are supplied and no real consent is collected. The actual approved text, version identifier, signing date and evidence must be preserved in the backend.</p></div><label class="check"><input type="checkbox" id="waiverRead" ${read?'checked':''}><span>I have reviewed this agreement and agree to sign it electronically.</span></label><div class="signbox"><strong>${isMinor()?'Parent / legal guardian signature':'Participant signature'}</strong><p class="details" style="margin-top:7px">Enter the signer's full legal name. ${isMinor()?'The minor does not sign in this demonstration.':'The participant signs their own agreement.'}</p>${lbl('Typed electronic signature','waiverSign',sign,'text','Full legal name')}<div class="smallprint">Expected signer: <strong>${esc(signer)}</strong>. In production this action requires verified signer identity, consent to electronic records, and a durable audit trail.</div></div>${nav(ev?'Review completion':'Continue')}`;}
function page(){switch(current()){
 case 'payer':return `<div class="kicker">Your contact information</div><h2>How can we reach you?</h2><p class="muted">Enter the contact information for the person coordinating this registration. These details do not grant access to another participant's private record.</p>${lbl('Your email address','payer',S.payer,'email','you@example.com')}${lbl('Your phone number','payerPhone',S.payerPhone,'tel','(555) 555-0123')}${nav()}`;
 case 'people':return `<div class="kicker">Who's joining?</div><h2>Who are you registering?</h2><p class="muted">Add yourself, another participant, or both. Each person gets their own private completion steps.</p>${S.people.map((p,i)=>`<div class="person"><div class="row"><strong>Participant ${i+1}</strong>${S.people.length>1?`<button class="btn secondary small" data-remove="${p.id}">Remove</button>`:''}</div><label class="field">Full name<input data-id="${p.id}" data-key="name" value="${esc(p.name)}" placeholder="Full name"></label><label class="field">Invitation email (optional for minors)<input type="email" data-id="${p.id}" data-key="email" value="${esc(p.email)}" placeholder="participant@example.com"></label></div>`).join('')}<button class="btn secondary" id="add">+ Add a participant</button><p class="smallprint">For minors, an invitation will instead be routed to a verified parent or legal guardian. This prototype collects contact information but does not send invitations.</p>${nav()}`;
 case 'offering':return `<div class="kicker">Choose a season or tournament</div><h2>What are you registering for?</h2><p class="muted">Eligible offerings will come from League HQ and Tournament HQ, with waiver requirements assigned through Registration HQ.</p><label class="field">Season or tournament<select id="offering"><option value="">Choose one…</option>${[...new Set(offerings.map(o=>o.kind))].map(k=>`<optgroup label="${esc(k)}">${offerings.filter(o=>o.kind===k).map(o=>`<option value="${o.id}" ${S.offering===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</optgroup>`).join('')}</select></label>${selected()?`<div class="note"><strong>${esc(selected().name)}</strong><div>${esc(selected().when)}</div><div>Illustrative fee: $${selected().cost} per participant</div><div>${selected().extra?'General waiver + event-specific waiver':'General participation waiver'}</div></div>`:''}${nav()}`;
 case 'review':return `<div class="kicker">Review</div><h2>Does everything look right?</h2><div class="summaryrow"><span>Offering</span><strong>${esc(selected()?.name)}</strong></div><div class="summaryrow"><span>Payer</span><strong>${esc(S.payer)}</strong></div>${S.people.map(p=>`<div class="summaryrow"><div><strong>${esc(p.name)}</strong><div class="tiny muted">${esc(p.email)}</div></div><strong>$${selected()?.cost||0}</strong></div>`).join('')}<div class="summaryrow"><strong>Illustrative total</strong><strong>$${(selected()?.cost||0)*S.people.length}</strong></div><div class="note">The next cards demonstrate one participant's private completion journey. They do not expose or complete the other listed participants' forms. No purchase is made.</div><label class="check"><input id="ack" type="checkbox" ${S.ack?'checked':''}><span>I understand this is a demonstration, not a registration or payment.</span></label>${nav('Preview participant form')}`;
 case 'identity':return `<div class="kicker">Private participant form · Demo</div><h2>Who is completing this registration?</h2><p class="muted">The participant's age determines which signature and consent process is required.</p><div class="choicegrid"><label class="choice"><input type="radio" name="path" value="adult" ${S.path==='adult'?'checked':''}><span><strong>Adult participant (18 or older)</strong><small>I will review and sign my own waivers.</small></span></label><label class="choice"><input type="radio" name="path" value="minor" ${S.path==='minor'?'checked':''}><span><strong>Minor participant (under 18)</strong><small>A parent or legal guardian must complete the consent and waiver-signing steps.</small></span></label></div>${lbl('Participant full legal name','participantName',S.participantName,'text','Full legal name')}${lbl('Date of birth','dob',S.dob,'date','')}${lbl(S.path==='minor'?'Minor participant email (optional)':'Participant invitation email','participantEmail',S.participantEmail,'email','participant@example.com')}<div class="note">The birth date is checked against the selected adult/minor path. Actual event age eligibility and guardian identity verification will be enforced by backend rules.</div>${nav()}`;
 case 'phone':return `<div class="kicker">Private participant form</div><h2>${isMinor()?'How can we contact the participant?':'What is your phone number?'}</h2><p class="muted">${isMinor()?'Enter a participant phone number if available. Guardian contact information is collected separately.':'This number belongs to the participant, not necessarily the person paying.'}</p>${lbl(isMinor()?'Participant phone (optional for minors)':'Participant phone number','participantPhone',S.participantPhone,'tel','(555) 555-0123')}${nav()}`;
 case 'emergency':return `<div class="kicker">Private participant form</div><h2>Who should we contact in an emergency?</h2><p class="muted">Designate an emergency contact for this participant.</p>${lbl('Emergency contact’s full name','emergencyName',S.emergencyName,'text','Full name')}<label class="field">Relationship to participant<select id="emergencyRelationship"><option value="">Select relationship…</option>${selectOptions(['Parent / guardian','Spouse / partner','Sibling','Other family member','Friend','Other'],S.emergencyRelationship)}</select></label>${lbl('Emergency contact phone number','emergencyPhone',S.emergencyPhone,'tel','(555) 555-0123')}${nav()}`;
 case 'guardian':return `<div class="kicker">Minor participant · Guardian authorization</div><h2>Parent or legal guardian information</h2><p class="muted">The guardian completes this step through their own verified invitation in the live system. A payer is not automatically authorized to consent for a minor.</p>${lbl('Guardian’s full legal name','guardianName',S.guardianName,'text','Full legal name')}<label class="field">Relationship to minor<select id="guardianRelationship"><option value="">Select relationship…</option>${selectOptions(['Parent','Legal guardian'],S.guardianRelationship)}</select></label>${lbl('Guardian email address','guardianEmail',S.guardianEmail,'email','guardian@example.com')}${lbl('Guardian phone number','guardianPhone',S.guardianPhone,'tel','(555) 555-0123')}<label class="check"><input type="checkbox" id="guardianConsent" ${S.guardianConsent?'checked':''}><span>I confirm that I am the participant's parent or legal guardian and am authorized to complete this consent process.</span></label><div class="note">In production, guardian authorization must be verified before any signature is accepted; age eligibility for the specific event is a separate check.</div>${nav()}`;
 case 'universal':return waiverCard('universal','Sovereign Sports General Participation Waiver');
 case 'event':return waiverCard('event',`${selected()?.name||'Selected event'} — Additional Agreement`);
 case 'complete':return `<div class="kicker">Preview complete</div><h2>${isMinor()?'Minor/guardian path reviewed':'Adult participant path reviewed'}</h2><p class="muted">This prototype shows the intended workflow and validates required fields. It did not store any legally executed signatures, issue invitations, or enroll anyone.</p><div class="sectionline"><strong>Participant</strong><span>${esc(S.participantName)} · ${isMinor()?'Minor':'Adult'}</span></div><div class="sectionline"><strong>Emergency contact</strong><span>${esc(S.emergencyName)} (${esc(S.emergencyRelationship)})</span></div>${isMinor()?`<div class="sectionline"><strong>Guardian signer</strong><span>${esc(S.guardianName)} · ${esc(S.guardianRelationship)}</span></div>`:''}<div class="sectionline"><strong>General waiver</strong><span>Simulated acknowledgment and typed signature input completed</span></div>${selected()?.extra?'<div class="sectionline"><strong>Event waiver</strong><span>Simulated additional acknowledgment and typed signature input completed</span></div>':''}<div class="note">Production clearance remains pending until verified identity, signed documents, applicable eligibility, and other requirements are processed by the backend. Payment integration is still paused.</div><div class="actions"><button class="btn ghost" id="back">← Back</button><button class="btn primary" id="restart">Start over</button></div>`;
 }}
function validEmail(s){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.trim());}
function validPhone(s){return (s.match(/\d/g)||[]).length>=10&&(s.match(/\d/g)||[]).length<=15&&/^[\d\s()+.\-]+$/.test(s.trim());}
function ageFromDob(v){const d=new Date(v+'T12:00:00');if(!v||Number.isNaN(+d))return null;const t=new Date();if(d>t)return null;let age=t.getFullYear()-d.getFullYear();if(t.getMonth()<d.getMonth()||(t.getMonth()===d.getMonth()&&t.getDate()<d.getDate()))age--;return age;}
function clearWaivers(){S.universalRead=false;S.universalSign='';S.eventRead=false;S.eventSign='';}
function render(){const seq=steps();if(S.step>=seq.length)S.step=seq.length-1;const k=current();$('count').textContent=`${S.step+1} of ${seq.length} · ${names[k]}`;$('fill').style.width=`${(S.step+1)/seq.length*100}%`;$('card').innerHTML=page();bind();}
function bind(){
 const fields=['payer','payerPhone','participantName','participantEmail','dob','participantPhone','emergencyName','emergencyRelationship','emergencyPhone','guardianName','guardianEmail','guardianPhone','guardianRelationship'];
 fields.forEach(id=>{if($(id))$(id).oninput=e=>S[id]=e.target.value;});
 document.querySelectorAll('[data-key]').forEach(el=>el.oninput=e=>{const p=S.people.find(x=>x.id===Number(el.dataset.id));if(p)p[el.dataset.key]=e.target.value});
 document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{S.people=S.people.filter(p=>p.id!==Number(el.dataset.remove));render();});
 if($('add'))$('add').onclick=()=>{S.people.push({id:S.next++,name:'',email:''});render();};
 if($('offering'))$('offering').onchange=e=>{S.offering=e.target.value;S.ack=false;clearWaivers();render();};
 if($('ack'))$('ack').onchange=e=>S.ack=e.target.checked;
 document.querySelectorAll('input[name=path]').forEach(el=>el.onchange=e=>{S.path=e.target.value;S.guardianConsent=false;clearWaivers();render();});
 if($('guardianConsent'))$('guardianConsent').onchange=e=>S.guardianConsent=e.target.checked;
 if($('waiverRead'))$('waiverRead').onchange=e=>{S[current()==='event'?'eventRead':'universalRead']=e.target.checked;};
 if($('waiverSign'))$('waiverSign').oninput=e=>{S[current()==='event'?'eventSign':'universalSign']=e.target.value;};
 if($('back'))$('back').onclick=()=>{S.step=Math.max(0,S.step-1);render();};
 if($('restart'))$('restart').onclick=()=>{S=fresh();render();};
 if($('next'))$('next').onclick=()=>{let err='';const k=current();
 if(k==='payer'){if(!validEmail(S.payer))err='Enter a valid payer email.';else if(!validPhone(S.payerPhone))err='Enter a valid payer phone number (10–15 digits).';}
 if(k==='people'){if(S.people.some(p=>!p.name.trim()||(p.email.trim()&&!validEmail(p.email))))err='Enter a name for each participant and a valid email if supplied.';else if(new Set(S.people.filter(p=>p.email.trim()).map(p=>p.email.trim().toLowerCase())).size!==S.people.filter(p=>p.email.trim()).length)err='Use distinct participant emails if supplied.';}
 if(k==='offering'&&!selected())err='Select a season or tournament.';
 if(k==='review'&&!S.ack)err='Acknowledge this is a demonstration.';
 if(k==='identity'){let age=ageFromDob(S.dob);if(!S.path)err='Choose the adult or minor path.';else if(!S.participantName.trim())err='Enter the participant full legal name.';else if(age===null)err='Enter a valid date of birth.';else if((S.path==='minor')!==(age<18))err='The selected adult/minor path does not match the date of birth.';else if((S.participantEmail.trim()||!isMinor())&&!validEmail(S.participantEmail))err='Enter a valid participant email (optional for minors).';}
 if(k==='phone'&&(!isMinor()||S.participantPhone.trim())&&!validPhone(S.participantPhone))err='Enter a valid participant phone number (10–15 digits).';
 if(k==='emergency'){if(!S.emergencyName.trim())err='Enter the emergency contact name.';else if(!S.emergencyRelationship)err='Choose the emergency contact relationship.';else if(!validPhone(S.emergencyPhone))err='Enter a valid emergency phone number.';}
 if(k==='guardian'){if(!S.guardianName.trim())err='Enter the guardian full legal name.';else if(!S.guardianRelationship)err='Choose parent or legal guardian.';else if(!validEmail(S.guardianEmail))err='Enter a valid guardian email.';else if(!validPhone(S.guardianPhone))err='Enter a valid guardian phone number.';else if(!S.guardianConsent)err='Guardian authorization acknowledgment is required.';}
 if(k==='universal'||k==='event'){const ev=k==='event',read=ev?S.eventRead:S.universalRead,sig=ev?S.eventSign:S.universalSign;const expected=isMinor()?S.guardianName:S.participantName;if(!read)err='Review and acknowledge this agreement.';else if(sig.trim().replace(/\s+/g,' ').toLocaleLowerCase()!==expected.trim().replace(/\s+/g,' ').toLocaleLowerCase())err='For this demo, type the full legal name shown as the expected signer.';}
 if(err){$('err').textContent=err;return;}S.step++;render();window.scrollTo({top:0,behavior:'smooth'});
 };
}
render();
</script></body></html>

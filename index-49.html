<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b46"><title>Registration HQ · R1.2 Cards</title><style>
:root{--navy:#142b46;--gold:#b58d49;--ink:#172b43;--muted:#607083;--line:#dce3eb;--bg:#f3f5f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.header{padding:22px 20px;background:var(--navy);color:white;text-align:center}.eyebrow{font-size:11px;letter-spacing:.15em;color:#ead3a4;font-weight:800}.header h1{font-size:22px;margin:5px 0}.wrap{max-width:670px;padding:24px 16px 50px;margin:auto}.demo{font-size:12px;color:#68501e;background:#fff6e2;border:1px solid #ebd5aa;padding:10px 14px;border-radius:9px;margin-bottom:23px}.progress{display:flex;align-items:center;gap:13px;margin-bottom:15px}.track{height:5px;border-radius:30px;background:#dce2e9;flex:1;overflow:hidden}.fill{background:var(--gold);height:100%;transition:width .2s}.count{font-weight:700;color:var(--muted);font-size:12px}.card{background:white;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 28px #142b4610;padding:clamp(22px,5vw,39px);min-height:370px}.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:#93723e;font-weight:800}.card h2{font-size:clamp(23px,4vw,29px);line-height:1.17;margin:12px 0 12px}.muted{color:var(--muted)}.card p{margin:0 0 19px}.field{display:flex;flex-direction:column;gap:7px;margin:18px 0;font-weight:650;font-size:14px}.field input,.field select{border:1px solid #b6c4d3;border-radius:10px;padding:14px 12px;background:white;color:var(--ink);width:100%;min-height:50px}.field input:focus,.field select:focus{outline:2px solid #ab874e;outline-offset:1px}.person{padding:16px;border:1px solid var(--line);border-radius:13px;margin:16px 0}.person .field{margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{border:0;background:var(--navy);color:white;border-radius:10px;padding:13px 19px;font-weight:750}.btn.secondary{background:#eaf0f6;color:var(--navy)}.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line)}.btn.small{font-size:12px;padding:7px 9px}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:29px}.actions .btn.primary{margin-left:auto}.error{min-height:19px;color:#ae3131;font-size:13px;font-weight:650}.note{border-left:3px solid var(--gold);padding:12px 14px;background:#faf7ef;margin:14px 0;color:#594d3a;font-size:13px}.summaryrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.tiny{font-size:12px}.chip{font-size:12px;background:#edf2f6;padding:5px 10px;border-radius:20px;font-weight:700}.check{display:flex;gap:10px;margin-top:20px;font-size:14px}.check input{width:19px;height:19px;flex-shrink:0}.finish{padding:14px;border:1px solid var(--line);border-radius:12px;margin:10px 0}.footer{font-size:12px;text-align:center;color:var(--muted);margin-top:21px}.hide{display:none!important}@media(max-width:530px){.wrap{padding:18px 12px 35px}.card{padding:23px 20px;min-height:340px}.header{padding:17px}.actions{gap:8px}.btn{padding:12px 13px}}
</style></head><body><header class="header"><div class="eyebrow">SOVEREIGN SPORTS · REGISTRATION HQ</div><h1>Registration</h1></header><main class="wrap"><div class="demo"><strong>R1.2 design prototype.</strong> Fictional events and local-only form data. No registrations, emails, payment, waiver signatures, or cloud writes.</div><div class="progress"><span class="count" id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><section class="card" id="card" aria-live="polite"></section><div class="footer">One card at a time · No payment integration · Development candidate</div></main>
<script>
'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const offerings=[{id:'l-danville',kind:'League HQ · Seasons',name:'Danville · Spring Season (example)',when:'Spring 2027 · Demo',cost:45},{id:'l-somerset',kind:'League HQ · Seasons',name:'Somerset · Season 1 (example)',when:'2027 · Demo',cost:45},{id:'t-ice',kind:'Tournament HQ · Events',name:'The Ice Ball (example)',when:'January 23, 2027 · Demo',cost:30},{id:'t-spring',kind:'Tournament HQ · Events',name:'The Spring Court (example)',when:'April 2027 · Demo',cost:30}];
const S={step:0,payer:'',people:[{id:1,name:'',email:''}],next:2,offering:'',ack:false,preview:1,completion:{}};
const cards=['Your information','Participants','Season or event','Review','Completion preview'];
function selected(){return offerings.find(x=>x.id===S.offering)}
function nav(backLabel='Back',nextLabel='Continue'){return `<div class="error" id="err" role="alert"></div><div class="actions">${S.step?`<button class="btn ghost" id="back">← ${backLabel}</button>`:''}<button class="btn primary" id="next">${nextLabel} →</button></div>`}
function page(){switch(S.step){
case 0:return `<div class="kicker">A simple place to start</div><h2>What's your email address?</h2><p class="muted">Enter the email you want associated with the registration or payment. You'll choose the season or event shortly.</p><label class="field">Your email address<input id="payer" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" value="${esc(S.payer)}"></label>${nav('','Continue')}`;
case 1:return `<div class="kicker">Who's joining?</div><h2>Who are you registering?</h2><p class="muted">Add yourself, another participant, or both. Each person will later complete their own private details and waiver.</p>${S.people.map((p,i)=>`<div class="person"><div class="row"><strong>Participant ${i+1}</strong>${S.people.length>1?`<button class="btn secondary small" data-remove="${p.id}">Remove</button>`:''}</div><label class="field">Full name<input data-id="${p.id}" data-key="name" autocomplete="off" placeholder="Full name" value="${esc(p.name)}"></label><label class="field">Email for personal invitation<input data-id="${p.id}" data-key="email" type="email" inputmode="email" placeholder="participant@example.com" value="${esc(p.email)}"></label></div>`).join('')}<button class="btn secondary" id="add">+ Add a participant</button>${nav()}`;
case 2:return `<div class="kicker">Choose an offering</div><h2>What are you registering for?</h2><p class="muted">Choose from eligible seasons and tournaments. This dropdown will eventually be populated from League HQ and Tournament HQ.</p><label class="field">Season or tournament<select id="offering"><option value="">Choose one…</option>${[...new Set(offerings.map(o=>o.kind))].map(k=>`<optgroup label="${esc(k)}">${offerings.filter(x=>x.kind===k).map(o=>`<option value="${o.id}" ${S.offering===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</optgroup>`).join('')}</select></label>${selected()?`<div class="note"><strong>${esc(selected().name)}</strong><div>${esc(selected().when)}</div><div>Illustrative fee: $${selected().cost} per participant</div></div>`:''}${nav()}`;
case 3:return `<div class="kicker">Almost finished</div><h2>Review your registration</h2><p class="muted">Check the participants and offering before continuing to the private-completion preview.</p><div class="summaryrow"><span>Offering</span><strong>${esc(selected()?.name)}</strong></div><div class="summaryrow"><span>Payer email</span><strong>${esc(S.payer)}</strong></div>${S.people.map(p=>`<div class="summaryrow"><div><strong>${esc(p.name)}</strong><div class="tiny muted">${esc(p.email)}</div></div><strong>$${selected()?.cost||0}</strong></div>`).join('')}<div class="summaryrow"><strong>Illustrative total</strong><strong>$${(selected()?.cost||0)*S.people.length}</strong></div><div class="note">Payment is not connected. This prototype does not create registrations or reserve capacity.</div><label class="check"><input type="checkbox" id="ack" ${S.ack?'checked':''}><span>I understand that this is only a demonstration and does not enroll or charge anyone.</span></label>${nav('Edit selection','Preview next steps')}`;
case 4:return `<div class="kicker">After registration</div><h2>Each participant completes their own steps.</h2><p class="muted">In production, each person receives private access to their personal information and waiver. Paying for someone never grants access to their private records.</p>${S.people.map(p=>`<div class="finish row"><div><strong>${esc(p.name)}</strong><div class="tiny muted">${esc(p.email)}</div></div><span class="chip">Pending</span></div>`).join('')}<div class="note">This is an informational preview only. Verified payment, individual consent and eligibility checks remain required before anyone can participate.</div><div class="actions"><button class="btn ghost" id="back">← Review</button><button class="btn primary" id="restart">Start over</button></div>`;}}
function validEmail(s){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s.trim())}
function render(){ $('count').textContent=`${S.step+1} of ${cards.length} · ${cards[S.step]}`;$('fill').style.width=`${(S.step+1)/cards.length*100}%`;$('card').innerHTML=page(); bind(); }
function bind(){if($('payer'))$('payer').oninput=e=>S.payer=e.target.value;document.querySelectorAll('[data-key]').forEach(el=>el.oninput=e=>{let p=S.people.find(p=>p.id===Number(el.dataset.id));if(p)p[el.dataset.key]=e.target.value});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{S.people=S.people.filter(p=>p.id!==Number(el.dataset.remove));render()});if($('add'))$('add').onclick=()=>{S.people.push({id:S.next++,name:'',email:''});render()};if($('offering'))$('offering').onchange=e=>{S.offering=e.target.value;S.ack=false;render()};if($('ack'))$('ack').onchange=e=>S.ack=e.target.checked;if($('back'))$('back').onclick=()=>{S.step--;render()};if($('restart'))$('restart').onclick=()=>{Object.assign(S,{step:0,payer:'',people:[{id:1,name:'',email:''}],next:2,offering:'',ack:false,preview:1,completion:{}});render()};if($('next'))$('next').onclick=()=>{let err='';if(S.step===0&&!validEmail(S.payer))err='Enter a valid email address.';if(S.step===1){if(S.people.some(p=>!p.name.trim()||!validEmail(p.email)))err='Enter a full name and valid email for each participant.';else if(new Set(S.people.map(p=>p.email.trim().toLowerCase())).size!==S.people.length)err='Each participant needs a distinct invitation email for this prototype.';}if(S.step===2&&!selected())err='Select a season or tournament.';if(S.step===3&&!S.ack)err='Please acknowledge that this is a demonstration.';if(err){$('err').textContent=err;return;}S.step++;render();window.scrollTo({top:0,behavior:'smooth'});};}
render();
</script></body></html>
